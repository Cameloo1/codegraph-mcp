<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="codegraph-mcp terminal quickstart animation">
  <style>
    .bg { fill: #0d1117; }
    .chrome { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .prompt { fill: #7ee787; font-weight: 700; }
    .path { fill: #79c0ff; }
    .cmd { fill: #c9d1d9; }
    .ok { fill: #a5d6ff; }
    .key { fill: #d2a8ff; }
    .value { fill: #ffa657; }
    .muted { fill: #8b949e; }
    .line { opacity: 0; animation: reveal 16s infinite steps(1, end); }
    .l1 { animation-delay: 0.2s; }
    .l2 { animation-delay: 1.6s; }
    .l3 { animation-delay: 2.4s; }
    .l4 { animation-delay: 3.1s; }
    .l5 { animation-delay: 4.4s; }
    .l6 { animation-delay: 5.9s; }
    .l7 { animation-delay: 6.8s; }
    .l8 { animation-delay: 7.5s; }
    .l9 { animation-delay: 8.4s; }
    .l10 { animation-delay: 10.0s; }
    .l11 { animation-delay: 11.0s; }
    .l12 { animation-delay: 11.8s; }
    .l13 { animation-delay: 12.6s; }
    .l14 { animation-delay: 13.4s; }
    .cursor { fill: #c9d1d9; animation: blink 1s infinite steps(1, end); }
    @keyframes reveal { 0%, 94% { opacity: 1; } 94.1%, 100% { opacity: 0; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 18px; }
    .small { font-size: 16px; }
  </style>
  <rect class="bg" width="980" height="520" rx="14" />
  <rect class="chrome" x="18" y="18" width="944" height="484" rx="12" />
  <circle class="dot-red" cx="44" cy="42" r="7" />
  <circle class="dot-yellow" cx="68" cy="42" r="7" />
  <circle class="dot-green" cx="92" cy="42" r="7" />
  <text class="muted small" x="122" y="48">codegraph-mcp quickstart</text>

  <g transform="translate(42 86)">
    <text class="line l1" y="0"><tspan class="prompt">wasif@chicago</tspan><tspan class="cmd">:</tspan><tspan class="path">~/codegraph-mcp</tspan><tspan class="cmd">$ cargo run --bin codegraph-mcp -- index . --agent-json</tspan></text>
    <text class="line l2 small" y="34"><tspan class="ok">   Compiling</tspan><tspan class="cmd"> codegraph-mcp v0.0.0</tspan></text>
    <text class="line l3 small" y="62"><tspan class="ok">    Finished</tspan><tspan class="cmd"> dev [unoptimized + debuginfo] target(s)</tspan></text>
    <text class="line l4 small" y="90"><tspan class="cmd">{</tspan><tspan class="key">"status"</tspan><tspan class="cmd">:</tspan><tspan class="value">"ok"</tspan><tspan class="cmd">, </tspan><tspan class="key">"claimable"</tspan><tspan class="cmd">:</tspan><tspan class="value">true</tspan><tspan class="cmd">, </tspan><tspan class="key">"storage_policy"</tspan><tspan class="cmd">:</tspan><tspan class="value">"proof:compact-proof-graph"</tspan><tspan class="cmd">}</tspan></text>

    <text class="line l5" y="144"><tspan class="prompt">wasif@chicago</tspan><tspan class="cmd">:</tspan><tspan class="path">~/codegraph-mcp</tspan><tspan class="cmd">$ cargo run --bin codegraph-mcp -- query symbols index_repo_to_db --agent-json --limit 3</tspan></text>
    <text class="line l6 small" y="178"><tspan class="cmd">{</tspan><tspan class="key">"status"</tspan><tspan class="cmd">:</tspan><tspan class="value">"ok"</tspan><tspan class="cmd">, </tspan><tspan class="key">"command"</tspan><tspan class="cmd">:</tspan><tspan class="value">"query symbols"</tspan><tspan class="cmd">, </tspan><tspan class="key">"result_count"</tspan><tspan class="cmd">:</tspan><tspan class="value">3</tspan><tspan class="cmd">}</tspan></text>
    <text class="line l7 small" y="206"><tspan class="cmd">  </tspan><tspan class="key">"symbol"</tspan><tspan class="cmd">:</tspan><tspan class="value">"index_repo_to_db"</tspan><tspan class="cmd">, </tspan><tspan class="key">"kind"</tspan><tspan class="cmd">:</tspan><tspan class="value">"Function"</tspan></text>
    <text class="line l8 small" y="234"><tspan class="cmd">  </tspan><tspan class="key">"file"</tspan><tspan class="cmd">:</tspan><tspan class="value">"crates/codegraph-index/src/lib.rs"</tspan></text>

    <text class="line l9" y="288"><tspan class="prompt">wasif@chicago</tspan><tspan class="cmd">:</tspan><tspan class="path">~/codegraph-mcp</tspan><tspan class="cmd">$ cargo run --bin codegraph-mcp -- context-pack --task "Trace indexing entry point" --seed index_repo_to_db --agent-json --budget 1600</tspan></text>
    <text class="line l10 small" y="322"><tspan class="cmd">{</tspan><tspan class="key">"status"</tspan><tspan class="cmd">:</tspan><tspan class="value">"ok"</tspan><tspan class="cmd">, </tspan><tspan class="key">"claimable"</tspan><tspan class="cmd">:</tspan><tspan class="value">true</tspan><tspan class="cmd">, </tspan><tspan class="key">"graph_proof"</tspan><tspan class="cmd">:</tspan><tspan class="value">true</tspan><tspan class="cmd">}</tspan></text>
    <text class="line l11 small" y="350"><tspan class="cmd">  </tspan><tspan class="key">"proof_status"</tspan><tspan class="cmd">:</tspan><tspan class="value">"verified_graph_path"</tspan><tspan class="cmd">, </tspan><tspan class="key">"critical_symbols"</tspan><tspan class="cmd">:[</tspan><tspan class="value">"index_repo_to_db"</tspan><tspan class="cmd">]</tspan></text>
    <text class="line l12 small" y="378"><tspan class="cmd">  </tspan><tspan class="key">"source_spans"</tspan><tspan class="cmd">:[</tspan><tspan class="value">"crates/codegraph-index/src/lib.rs"</tspan><tspan class="cmd">]</tspan></text>
    <text class="line l13 small" y="406"><tspan class="cmd">  </tspan><tspan class="key">"not_claimable_as"</tspan><tspan class="cmd">:[</tspan><tspan class="value">"unstale_db"</tspan><tspan class="cmd">, </tspan><tspan class="value">"unverified_text_guess"</tspan><tspan class="cmd">]</tspan></text>
    <text class="line l14" y="454"><tspan class="prompt">wasif@chicago</tspan><tspan class="cmd">:</tspan><tspan class="path">~/codegraph-mcp</tspan><tspan class="cmd">$</tspan><rect class="cursor" x="309" y="438" width="10" height="22" /></text>
  </g>
</svg>
