<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="760" viewBox="0 0 1480 760" role="img" aria-labelledby="title desc">
<title id="title">CodeGraph agent-use command sequence</title>
<desc id="desc">An illustrative terminal sequence showing lifecycle status, compact context, changed-file validation, and project tests. It contains no machine-local path or benchmark result.</desc>
<defs>
<filter id="selected-glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="2.4" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
</filter>
<style>
.display{font-family:Arial,Helvetica,sans-serif;fill:#f4f6f8;font-weight:600;letter-spacing:-0.045em}
.body{font-family:Arial,Helvetica,sans-serif;fill:#b6bdc8}
.mono{font-family:Consolas,Menlo,monospace;fill:#7e8795;letter-spacing:.06em}
.guide{fill:none;stroke:#b6bdc8;stroke-width:1;stroke-dasharray:2 10;opacity:.12}
.axis{fill:none;stroke:#b6bdc8;stroke-width:1;opacity:.055}
.path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.label{font-family:Consolas,Menlo,monospace;fill:#697382;font-size:10px;letter-spacing:.03em}
.small{font-size:12px}
.tiny{font-size:10px}
@media(prefers-reduced-motion:no-preference){.flow-a{stroke-dasharray:28 420;animation:flow 12s linear infinite}.flow-b{stroke-dasharray:18 360;animation:flow 16s linear infinite reverse}@keyframes flow{to{stroke-dashoffset:-448}}}
</style>
</defs>
<rect width="1480" height="760" fill="#030508"/>
<rect width="1480" height="760" filter="url(#grain)" opacity=".025" style="mix-blend-mode:soft-light"/>
<rect x="36" y="34" width="1408" height="692" rx="7" fill="#080c12" stroke="#252d38"/>
<rect x="36" y="34" width="1408" height="48" rx="7" fill="#101620"/>
<circle cx="60" cy="58" r="5" fill="#f1788e"/><circle cx="80" cy="58" r="5" fill="#e7b85a"/><circle cx="100" cy="58" r="5" fill="#17d9a1"/>
<text x="124" y="63" class="mono tiny">illustrative local workflow</text>
<text x="76" y="118" class="mono" font-size="18" fill="#7e8795" opacity="0.72"># 1. inspect lifecycle and claimability</text>
<text x="76" y="151" class="mono" font-size="18" fill="#f4f6f8" opacity="1">$ codegraph-mcp agent-use status --repo /workspace --json</text>
<rect x="70" y="128" width="6" height="28" fill="#1677f1" opacity=".58"/>
<text x="76" y="208" class="mono" font-size="18" fill="#7e8795" opacity="0.72"># 2. request bounded, proof-labeled context</text>
<text x="76" y="241" class="mono" font-size="18" fill="#f4f6f8" opacity="1">$ codegraph-mcp agent-use context-pack --repo /workspace \</text>
<rect x="70" y="218" width="6" height="28" fill="#17d9a1" opacity=".58"/>
<text x="76" y="272" class="mono" font-size="18" fill="#f4f6f8" opacity="1">    --task &quot;Trace the change impact&quot; --agent-json</text>
<rect x="70" y="249" width="6" height="28" fill="#8b78f6" opacity=".58"/>
<text x="76" y="329" class="mono" font-size="18" fill="#7e8795" opacity="0.72"># 3. validate the changed-file batch</text>
<text x="76" y="362" class="mono" font-size="18" fill="#f4f6f8" opacity="1">$ codegraph-mcp agent-use validate-edit --repo /workspace \</text>
<rect x="70" y="339" width="6" height="28" fill="#1e8bff" opacity=".58"/>
<text x="76" y="393" class="mono" font-size="18" fill="#f4f6f8" opacity="1">    --changed src/auth.ts --agent-json</text>
<rect x="70" y="370" width="6" height="28" fill="#1677f1" opacity=".58"/>
<text x="76" y="450" class="mono" font-size="18" fill="#7e8795" opacity="0.72"># 4. run the project checks before completion</text>
<text x="76" y="483" class="mono" font-size="18" fill="#f4f6f8" opacity="1">$ cargo test --workspace</text>
<rect x="70" y="460" width="6" height="28" fill="#17d9a1" opacity=".58"/>
<rect x="70" y="540" width="1340" height="1" fill="#202630"/>
<text x="76" y="583" class="body" font-size="17">CodeGraph adds context and validation beside normal developer tools.</text>
<text x="76" y="616" class="body" font-size="17">Candidate evidence remains labeled until graph/source verification succeeds.</text>
<text x="76" y="667" class="mono tiny">local only</text>
<text x="1404" y="667" class="mono tiny" text-anchor="end">no source edits performed by the MCP surface</text>
</svg>
