<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">CodeGraph verified signal field</title>
  <desc id="desc">Candidate evidence paths converge at graph and source verification. Supported proof paths continue toward a compact context packet while unsupported paths remain visibly incomplete.</desc>
  <defs>
    <linearGradient id="blueCyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1769ff"/><stop offset=".55" stop-color="#22a7ff"/><stop offset="1" stop-color="#24d7df"/></linearGradient>
    <linearGradient id="violetMint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a06cf5"/><stop offset=".5" stop-color="#2cc5e8"/><stop offset="1" stop-color="#20d49b"/></linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grain" width="140" height="140" patternUnits="userSpaceOnUse"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/></filter><rect width="140" height="140" filter="url(#noise)" opacity=".035"/></pattern>
    <style>
      .display{font-family:Arial,Helvetica,sans-serif;fill:#f4f6f8;font-weight:600;letter-spacing:-2.4px}.body{font-family:Arial,Helvetica,sans-serif;fill:#aeb7c4}.mono{font-family:Consolas,Menlo,monospace;fill:#768292;font-size:13px}.guide{fill:none;stroke:#586272;stroke-width:1;stroke-dasharray:5 8;opacity:.28}.candidate{fill:none;stroke:#53677f;stroke-width:1.15;stroke-dasharray:4 6;opacity:.44}.verified{fill:none;stroke:url(#blueCyan);stroke-width:1.55;opacity:.9}.derived{fill:none;stroke:url(#violetMint);stroke-width:1.35;opacity:.76}.node{fill:#dffcff}.bead{fill:#4fe1c1}.rule{stroke:#242b35;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="720" fill="#030508"/>
  <rect width="1600" height="720" fill="url(#grain)" opacity=".22"/>
  <line class="rule" x1="396" y1="58" x2="396" y2="662"/>
