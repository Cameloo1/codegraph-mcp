# Conservative OpenEvolve smoke config for the CodeGraph candidate-spool policy lab.
# The API key is resolved from the shell environment and must not be stored here.
max_iterations: 10
checkpoint_interval: 5
random_seed: 42
log_level: "INFO"

llm:
  primary_model: "gemini-3.1-flash-lite-preview"
  primary_model_weight: 0.85
  secondary_model: "gemini-3.5-flash"
  secondary_model_weight: 0.15
  api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.4
  max_tokens: 12000
  timeout: 120
  retries: 1

prompt:
  system_message: |
    You are optimizing a small standalone Python ranking and packetization policy for CodeGraph candidate-spool retrieval.
    Preserve required gold hits, keep candidate evidence non-proof, reduce packet bytes and latency, and keep behavior deterministic.
    Do not introduce external dependencies, filesystem writes, network calls, or CodeGraph product-source changes.

database:
  population_size: 30
  archive_size: 12
  num_islands: 2
  elite_selection_ratio: 0.25
  exploitation_ratio: 0.65
  similarity_threshold: 0.99

evaluator:
  timeout: 60
  max_retries: 0
  cascade_evaluation: false
  parallel_evaluations: 1
  use_llm_feedback: false

diff_based_evolution: true
max_code_length: 20000
early_stopping_metric: "combined_score"
